# Keeps this fork in step with zed-industries/zed, daily:
#
# - merges upstream main into main, and the upstream release branch this fork
#   is on (its newest vX.Y.x branch) into that branch;
# - when Zed ships a newer stable release, applies this fork's changes onto
#   the new upstream release branch and pushes it here (the release workflow
#   then builds it).
#
# A failed run makes GitHub email the account that owns this workflow. A new
# stable release fails the run on purpose, once, to send that email.
#
# GitHub's built-in token may not change files under .github/workflows, which
# upstream edits often; a FORK_SYNC_TOKEN secret (fine-grained token with
# Contents and Workflows write access to this repository) lifts that limit.

name: Sync fork with upstream

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

env:
  UPSTREAM: zed-industries/zed

jobs:
  sync:
    if: github.repository == 'NicolaPanero/zed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Find the release branches
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          stable=$(echo "$latest_tag" | sed -E 's/^v([0-9]+)\.([0-9]+)\..*/v\1.\2.x/')
          current=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' |
            grep -E '^v[0-9]+\.[0-9]+\.x$' | sort -V | tail -n 1 || true)
          newer=false
          if [ -n "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$stable" | sort -V | tail -n 1)" != "$current" ]; then
            newer=true
          fi
          echo "Zed stable: $latest_tag ($stable); this fork: ${current:-no release branch}"
          {
            echo "stable=$stable"
            echo "current=$current"
            echo "newer=$newer"
          } >> "$GITHUB_OUTPUT"

      - name: Merge upstream branches
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
          BRANCHES: main ${{ steps.release.outputs.current }}
        run: |
          failed=0
          for branch in $BRANCHES; do
            echo "::group::$branch"
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
              -f branch="$branch" \
              --jq '"\(.merge_type): \(.message)"'; then
              echo "::error title=Sync of $branch failed::Merging upstream $branch into this fork failed, most likely a conflict with this fork's changes."
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Port this fork's changes to the new stable branch
        if: steps.release.outputs.newer == 'true'
        env:
          TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
          OLD: ${{ steps.release.outputs.current }}
          NEW: ${{ steps.release.outputs.stable }}
        run: |
          set -euo pipefail
          git init -q port
          cd port
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add fork "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch -q --no-tags --depth=1 upstream \
            "refs/heads/$OLD:refs/remotes/upstream/$OLD" \
            "refs/heads/$NEW:refs/remotes/upstream/$NEW"
          git fetch -q --no-tags --depth=1 fork "refs/heads/$OLD:refs/remotes/fork/$OLD"

          # The fork's changes are everything its release branch has on top of
          # upstream's (the sync keeps upstream's fixes merged in), applied as
          # one commit: replaying the individual commits would also replay
          # edits that later ones undid.
          git diff --binary "upstream/$OLD" "fork/$OLD" > ../fork.patch
          git diff --stat "upstream/$OLD" "fork/$OLD" | tail -n 1

          git checkout -q -b "$NEW" "upstream/$NEW"
          if ! git apply --3way --index ../fork.patch; then
            git diff --name-only --diff-filter=U | sed 's/^/  conflict: /'
            echo "::error title=Zed ${NEW%.x} is stable::Applying this fork's changes from $OLD onto $NEW hit conflicts, so nothing was pushed. Port them by hand."
            exit 1
          fi
          git commit -q -m "Apply this fork's changes from $OLD" \
            -m "Ported automatically by the sync workflow from fork/$OLD onto upstream $NEW."

          # Start the branch at upstream's commit through the API (forks share
          # its objects), then push this one commit on top of it.
          GH_TOKEN="$TOKEN" gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$NEW" -f sha="$(git rev-parse "upstream/$NEW")" >/dev/null
          git push -q fork "$NEW"
          echo "::error title=Zed ${NEW%.x} is stable::This fork's changes were applied onto a new $NEW branch here; a new build follows. Try it before relying on it."
          exit 1

      # Upstream's own workflows would run here too (and fail without its
      # secrets), including ones added later, so keep them switched off; only
      # this fork's sync and release workflows stay on.
      - name: Keep upstream workflows disabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --repo "$GITHUB_REPOSITORY" --all --json path,state \
            --jq '.[] | select(.state == "active") | .path
              | select(. != ".github/workflows/sync_fork.yml" and . != ".github/workflows/fork_release.yml")' |
          while read -r path; do
            gh workflow disable "$(basename "$path")" --repo "$GITHUB_REPOSITORY"
          done
